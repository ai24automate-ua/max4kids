[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/products"
  to = "/.netlify/functions/products"
  status = 200

[[redirects]]
  from = "/api/feed"
  to = "/.netlify/functions/feed"
  status = 200

[[redirects]]
  from = "/product/:slug/"
  to = "/.netlify/functions/product-page?slug=:slug"
  status = 200

[[redirects]]
  from = "/product/:slug"
  to = "/.netlify/functions/product-page?slug=:slug"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/.netlify/functions/robots"
  status = 200
